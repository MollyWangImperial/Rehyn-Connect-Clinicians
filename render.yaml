services:
  - type: web
    name: rehyn-connect-clinicians
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # The clinician edition runs without the Anthropic and ElevenLabs keys: read aloud uses the device's own voice.
      # A Slack incoming webhook: the Rehyn team is told there when an urgent consultation request has had no clinician
      # answer in 5 minutes (server/urgent-alert.ts). Without it the alert goes to the server log only.
      - key: SLACK_WEBHOOK_URL
        sync: false
